# Cứ 15 phút một lần, lấy lời chúc và xác nhận tham dự từ trang tính Google
# rồi ghi thẳng vào thư mục du-lieu/ của repo này.
#
# Cần bật một lần: Settings -> Actions -> General -> Workflow permissions
#                  -> chọn "Read and write permissions" -> Save.
name: Gom lời chúc về repo

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # nút bấm chạy ngay, khỏi chờ

permissions:
  contents: write

concurrency:
  group: gom-loi-chuc
  cancel-in-progress: false

jobs:
  gom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Đọc trang tính, ghi ra du-lieu/
        run: python3 tools/gom-loi-chuc.py

      - name: Lưu lại nếu có gì mới
        run: |
          if [ -z "$(git status --porcelain du-lieu)" ]; then
            echo "Không có gì mới."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add du-lieu
          git commit -m "Gom lời chúc và xác nhận tham dự"
          git push
