<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tạo link mời riêng cho từng khách</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#2A4257; --accent:#3F657E; --cream:#F4F1EA; --cream2:#E7E2D8;
  --ink:#232E36; --soft:#5B666E; --line:rgba(42,66,87,.20); --sand:#7E6030;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);
  font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:15px;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:clamp(24px,5vw,48px) clamp(16px,4vw,32px) 80px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:400;
  font-size:clamp(1.6rem,4.6vw,2.3rem);color:var(--deep);margin:0 0 6px}
.sub{color:var(--soft);margin:0 0 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;
  padding:clamp(18px,3.5vw,26px);margin-bottom:20px}
label{display:block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--accent);font-weight:500;margin-bottom:8px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--cream);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,textarea:focus{outline:0;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(63,101,126,.14)}
textarea{min-height:150px;resize:vertical;line-height:1.9}
.hint{font-size:.85rem;color:var(--soft);margin:8px 0 0}
.btn{font:inherit;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
  font-weight:500;border-radius:999px;padding:11px 24px;cursor:pointer;
  border:1px solid var(--deep);background:var(--deep);color:#fff;transition:.25s}
.btn:hover{background:transparent;color:var(--deep)}
.btn--nho{padding:7px 15px;font-size:.68rem;letter-spacing:.1em;
  background:transparent;color:var(--deep)}
.btn--nho:hover{background:var(--deep);color:#fff}
.btn.ok,.btn--nho.ok{background:var(--sand);border-color:var(--sand);color:#fff}
.hang{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent);font-weight:500;padding:0 0 10px}
td{padding:11px 0;border-top:1px solid var(--line);vertical-align:middle}
td.ten{font-weight:500;white-space:nowrap;padding-right:14px}
td.link{width:100%}
td.link a{color:var(--soft);font-size:.82rem;word-break:break-all;text-decoration:none}
td.link a:hover{color:var(--accent);text-decoration:underline}
td.nut{text-align:right;padding-left:12px;white-space:nowrap}
.trong{color:var(--soft);font-style:italic}
@media (max-width:600px){
  td.ten,td.link,td.nut{display:block;width:auto;text-align:left;padding-left:0}
  td.ten{border-top:1px solid var(--line);padding-bottom:2px}
  td.link{border-top:0;padding:0 0 8px}
  td.nut{border-top:0;padding:0 0 12px}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Tạo link mời riêng cho từng khách</h1>
  <p class="sub">Mỗi khách một đường link, mở ra là thấy tên mình ngay trên bìa thiệp.</p>

  <div class="card">
    <label for="base">Địa chỉ thiệp cưới</label>
    <input id="base" type="url" spellcheck="false">
    <p class="hint">Tự điền sẵn. Nếu bạn đã có tên miền riêng thì dán vào đây.</p>
  </div>

  <div class="card">
    <label for="ds">Danh sách khách — mỗi dòng một người</label>
    <textarea id="ds" spellcheck="false" placeholder="Anh Tuấn&#10;Gia đình cô Ba&#10;Vợ chồng anh Nam chị Lan&#10;Team Marketing"></textarea>
    <div class="hang">
      <button class="btn" id="tao">Tạo link</button>
      <button class="btn btn--nho" id="chepHet">Chép tất cả</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Khách</th><th>Đường link</th><th></th></tr></thead>
      <tbody id="kq"><tr><td colspan="3" class="trong">Nhập danh sách rồi bấm “Tạo link”.</td></tr></tbody>
    </table>
  </div>
</div>

<script>
(function(){
  var $ = function(s){ return document.querySelector(s); };

  /* Địa chỉ thiệp = thư mục cha của trang công cụ này.
     Chạy trên máy hay trên GitHub Pages đều tự đúng. */
  $('#base').value = new URL('../', location.href).href.replace(/\/$/, '/');

  function taoLink(ten){
    var b = $('#base').value.trim() || './';
    if (!/\/$/.test(b) && !/\.html?$/i.test(b)) b += '/';
    return b + '?guest=' + encodeURIComponent(ten);
  }

  function danhSach(){
    return $('#ds').value.split('\n')
      .map(function(t){ return t.trim(); })
      .filter(function(t){ return t.length; });
  }

  function chep(text, nut){
    var xong = function(){
      var cu = nut.textContent;
      nut.textContent = 'Đã chép';
      nut.classList.add('ok');
      setTimeout(function(){ nut.textContent = cu; nut.classList.remove('ok'); }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(xong).catch(xong);
    } else {
      var ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta); xong();
    }
  }

  function ve(){
    var ds = danhSach(), tb = $('#kq');
    if (!ds.length) {
      tb.innerHTML = '<tr><td colspan="3" class="trong">Chưa có tên nào trong danh sách.</td></tr>';
      return;
    }
    tb.innerHTML = '';
    ds.forEach(function(ten){
      var link = taoLink(ten);
      var tr = document.createElement('tr');

      var tdTen = document.createElement('td');
      tdTen.className = 'ten'; tdTen.textContent = ten;

      var tdLink = document.createElement('td');
      tdLink.className = 'link';
      var a = document.createElement('a');
      a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = link;
      tdLink.appendChild(a);

      var tdNut = document.createElement('td');
      tdNut.className = 'nut';
      var nut = document.createElement('button');
      nut.className = 'btn btn--nho'; nut.type = 'button'; nut.textContent = 'Chép';
      nut.addEventListener('click', function(){ chep(link, nut); });
      tdNut.appendChild(nut);

      tr.appendChild(tdTen); tr.appendChild(tdLink); tr.appendChild(tdNut);
      tb.appendChild(tr);
    });
  }

  $('#tao').addEventListener('click', ve);
  $('#ds').addEventListener('input', ve);
  $('#base').addEventListener('input', ve);

  $('#chepHet').addEventListener('click', function(){
    var ds = danhSach();
    if (!ds.length) return;
    chep(ds.map(function(t){ return t + '\t' + taoLink(t); }).join('\n'), this);
  });
})();
</script>
</body>
</html>
